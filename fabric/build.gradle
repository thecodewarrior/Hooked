plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    modImplementation "dev.architectury:architectury-fabric:$project.architectury_api_version"


    modCompileOnly "curse.maven:irisshaders-455508:6213635" // Iris v1.8.8

    modImplementation "com.teamwizardry.librarianlib:mosaic-fabric:${liblib_version}"
    modImplementation "com.teamwizardry.librarianlib:glitter-fabric:${liblib_version}"
    modImplementation "com.teamwizardry.librarianlib:etcetera-fabric:${liblib_version}"

    modImplementation "dev.emi:trinkets:${project.trinkets_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"


    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
