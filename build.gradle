import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    alias(libs.plugins.loom) apply false
    alias(libs.plugins.architectury)
    alias(libs.plugins.shadow) apply false
    alias(libs.plugins.kotlinJvm) apply false
    alias(libs.plugins.ksp) apply false
}

architectury {
    minecraft = libs.versions.platform.minecraft.get()
    compileOnly()
}

allprojects {
    group = project.maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: libs.plugins.loom.get().pluginId
    apply plugin: libs.plugins.architectury.get().pluginId

    apply plugin: libs.plugins.kotlinJvm.get().pluginId
    apply plugin: libs.plugins.ksp.get().pluginId

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$project.archives_name-$project.name"
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://s01.oss.sonatype.org/content/repositories/snapshots" }
        exclusiveContent {
            forRepository { maven { url = "https://cursemaven.com"} }
            filter { includeGroup("curse.maven") }
        }
        maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
        maven { url = "https://maven.theillusivec4.top/" } // curios
        exclusiveContent {
            forRepository { maven { url = "https://maven.ryanhcode.dev/releases" } }
            filter {
                includeGroup("dev.ryanhcode.sable-companion")
                includeGroup("dev.ryanhcode.sable")
            }
        }
        
        // sable dependencies:
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // fuzs.forgeconfigapiport
        maven { url = "https://maven.blamejared.com" } // foundry.veil / foundry.imguimc
        mavenLocal()
    }

    dependencies {
        minecraft(libs.platform.minecraft)
        mappings loom.layered {
            it.mappings(variantOf(libs.platform.yarnMappings) { classifier ("v2") })
            it.mappings(libs.platform.yarnMappingsNeoForgePatch)
        }

        ksp libs.build.autoServiceKsp
        implementation libs.build.autoServiceAnnotations
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    tasks.withType(KotlinCompile.class).configureEach {
        compilerOptions {
            languageVersion = KotlinVersion.KOTLIN_2_0
            apiVersion = KotlinVersion.KOTLIN_2_0

            jvmTarget = JvmTarget.JVM_21
            javaParameters = true
            optIn.addAll(
                    "kotlin.ExperimentalStdlibApi",
                    "kotlin.ExperimentalUnsignedTypes",
                    "kotlin.contracts.ExperimentalContracts",
            )
            freeCompilerArgs.addAll(
                    "-Xjvm-default=all"
            )
        }
    }

    ksp {
        useKsp2 = true
    }
}
