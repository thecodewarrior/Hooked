plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs.configureEach {
        vmArg("-Dlibrarianlib.logging.debug=hooked")
    }
}

configurations {
    create("modJar")

    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge libs.platform.neoforge

    modImplementation libs.platform.mods.architecturyNeoForge

    implementation(libs.platform.mods.kotlinForForge)
    modImplementation(libs.mods.sableCompanionNeoForge)
    include(libs.mods.sableCompanionNeoForge)

    modImplementation libs.bundles.mods.liblib.neoforge

    // We need this because curios adds `remap = false` to its mixin annotations, which means architectury (rightly)
    // won't remap them to yarn mappings. I built a custom jar with that flag removed, and it works.
    modImplementation files("curios-neoforge-9.5.1+1.21.1.jar")
//    modCompileOnly variantOf(libs.mods.curios) { classifier("api") }
//    modRuntimeOnly variantOf(libs.mods.curios)

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

tasks.register("downloadModJars", Sync.class) {
    from(configurations.modJar)
    into("${project.projectDir}/run/mods")
}

def expansions = [
        version: project.version,
        dep_neoforge: libs.versions.platform.neoforge.get(),
        dep_minecraft: libs.versions.platform.minecraft.get(),
        dep_kotlinforforge: libs.versions.platform.mods.kotlinForForge.get(),
        dep_architectury: libs.versions.platform.mods.architectury.get(),
        dep_curios: libs.versions.mods.curios.get(),
        dep_liblib: libs.versions.mods.liblib.get(),
]
processResources {
    inputs.properties(expansions)
    dependsOn(tasks.downloadModJars)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(expansions)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
